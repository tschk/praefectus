[package]
name = "praefectus"
version = "0.8.4"
edition = "2024"
rust-version = "1.89"
license = "ISC"
description = "Policy-neutral, durable desktop action execution protocol"
readme = "README.md"
repository = "https://github.com/tschk/praefectus"
homepage = "https://github.com/tschk/praefectus"
documentation = "https://docs.rs/praefectus"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/examples/**",
    "/LICENSE",
    "/ACKNOWLEDGEMENTS.md",
    "/THIRD_PARTY_LICENSES.md",
    "/deny.toml",
    "/build.rs",
]

[features]
default = []
screencapturekit = ["dep:screencapturekit"]
skylight = []
iphone = ["dep:idevice", "dep:tokio", "dep:uuid", "dep:png", "dep:base64", "dep:plist", "dep:plist-macro", "dep:rand", "dep:rand_core", "dep:hkdf", "dep:chacha20poly1305", "dep:idevice-srp", "dep:siphasher", "dep:aes", "dep:cbc", "dep:hmac", "dep:sha1", "dep:tracing", "ed25519-dalek/rand_core"]

[workspace]
members = ["native/iphone"]
default-members = ["."]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "praefectus"
path = "src/main.rs"

[[example]]
name = "capabilities"
path = "examples/capabilities.rs"

[[example]]
name = "facetime_host"
path = "examples/facetime_host.rs"
test = true

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
getrandom = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
idevice = { version = "=0.1.68", optional = true, default-features = false, features = ["aws-lc", "core_device_proxy", "rsd", "tunnel_tcp_stack", "display_stream"] }
tokio = { version = "1.43", optional = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "fs"] }
uuid = { version = "1", optional = true, features = ["v3", "v4"] }
png = { version = "0.18", optional = true }
base64 = { version = "0.22", optional = true }
plist = { version = "1.8", optional = true }
plist-macro = { version = "0.1.6", optional = true }
rand = { version = "0.10", optional = true }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
hkdf = { version = "0.12", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
idevice-srp = { version = "0.6", optional = true }
siphasher = { version = "1", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true, features = ["alloc"] }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
foreign-types = "0.5"
screencapturekit = { version = "8.0.1", features = ["macos_14_0"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
phf = { version = "0.14.0", features = ["macros"] }
rustix = { version = "1.1", default-features = false, features = ["net", "process", "std"] }
x11rb = { version = "0.14", default-features = false, features = ["randr", "xtest"] }
zbus = { version = "6.1", default-features = false, features = ["default-rt", "proxy"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23"
